name: Reusable Lighthouse Audit

on:
  workflow_call:
    inputs:
      audit-url:
        description: Public URL to audit
        required: true
        type: string
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '24'
      build-project:
        description: Install dependencies and build before auditing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build project (optional)
        if: inputs.build-project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci; else npm install; fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; else echo "No build script; continuing with URL audit."; fi
      - name: Run Lighthouse
        env:
          AUDIT_URL: ${{ inputs.audit-url }}
        run: |
          mkdir -p lighthouse-report
          npx --yes lighthouse "$AUDIT_URL" \
            --preset=desktop \
            --output=html \
            --output-path=lighthouse-report/report.html \
            --chrome-flags="--headless --no-sandbox"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
