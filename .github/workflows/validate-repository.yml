name: Validate Project Development System

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vue-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install template dependencies
        working-directory: templates/vue3-javascript
        run: npm install --no-audit --no-fund
      - name: Build Vue template
        working-directory: templates/vue3-javascript
        run: npm run build
  skill-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Agent Skill entry point
        run: |
          test -s skills/project-development/SKILL.md
          grep -q '^name: project-development$' skills/project-development/SKILL.md
          test -d skills/project-development/references
